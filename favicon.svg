<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pitchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Pitch background -->
  <rect width="64" height="64" rx="14" fill="url(#pitchGrad)"/>
  
  <!-- Subtle turf stripes -->
  <rect x="16" y="0" width="16" height="64" fill="rgba(255,255,255,0.06)"/>
  <rect x="48" y="0" width="16" height="64" fill="rgba(255,255,255,0.06)"/>

  <!-- Tactical Pitch lines -->
  <rect x="6" y="6" width="52" height="52" rx="4" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="2"/>
  <line x1="6" y1="32" x2="58" y2="32" stroke="rgba(255,255,255,0.65)" stroke-width="2"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="2"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>

  <!-- Tactical movement arrow -->
  <path d="M 16 46 Q 26 22 44 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3,2" stroke-linecap="round"/>
  <polygon points="44,20 50,24 43,28" fill="#38bdf8"/>

  <!-- Soccer Ball with shadow -->
  <g filter="url(#shadow)">
    <circle cx="23" cy="23" r="10" fill="url(#ballGrad)" stroke="#1e293b" stroke-width="1.2"/>
    <!-- Center pentagon -->
    <polygon points="23,18.5 26.8,21.2 25.3,25.8 20.7,25.8 19.2,21.2" fill="#0f172a"/>
    <!-- Radiation lines -->
    <line x1="23" y1="18.5" x2="23" y2="13" stroke="#0f172a" stroke-width="1"/>
    <line x1="26.8" y1="21.2" x2="32" y2="20" stroke="#0f172a" stroke-width="1"/>
    <line x1="25.3" y1="25.8" x2="29.5" y2="30.5" stroke="#0f172a" stroke-width="1"/>
    <line x1="20.7" y1="25.8" x2="16.5" y2="30.5" stroke="#0f172a" stroke-width="1"/>
    <line x1="19.2" y1="21.2" x2="14" y2="20" stroke="#0f172a" stroke-width="1"/>
    <!-- Ball highlight -->
    <circle cx="20" cy="19" r="2.2" fill="rgba(255,255,255,0.7)"/>
  </g>

  <!-- Player Pin (Blue #10) -->
  <g filter="url(#shadow)">
    <circle cx="44" cy="42" r="7.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
    <text x="44" y="44.8" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle">10</text>
  </g>
</svg>
