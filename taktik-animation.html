<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taktikboard Pro – Waypoint Animation</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>tailwind.config = { darkMode:'class', theme:{ extend:{} } };</script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; }
  #pitchCanvas { touch-action: none; display: block; }
  #pitchCanvas.mode-drag  { cursor: grab; }
  #pitchCanvas.mode-drag.dragging { cursor: grabbing; }
  #pitchCanvas.mode-waypoint { cursor: crosshair; }
  .step-chip { user-select: none; }
  ::-webkit-scrollbar { height:5px; width:5px; }
  ::-webkit-scrollbar-track { background:#0f172a; }
  ::-webkit-scrollbar-thumb { background:#334155; border-radius:3px; }
  @keyframes pulse-rec { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  .rec-pulse { animation: pulse-rec 1s infinite; }
</style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen overflow-hidden flex flex-col select-none">

<!-- ══════════════════════════════════════════════════════════ HEADER -->
<header class="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center gap-2 flex-wrap z-30 shadow-lg flex-shrink-0">

  <!-- Logo -->
  <div class="flex items-center gap-2 mr-1">
    <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-emerald-600 to-green-400 flex items-center justify-center shadow-md">
      <i class="fa-solid fa-futbol text-white text-xs"></i>
    </div>
    <span class="font-bold text-sm text-white hidden sm:inline">Taktikboard <span class="text-emerald-400 font-black">Waypoint</span></span>
  </div>

  <div class="w-px h-6 bg-slate-700 mx-0.5 hidden sm:block"></div>

  <!-- Mode toggle -->
  <div class="flex items-center gap-0.5 bg-slate-800 p-0.5 rounded-xl border border-slate-700">
    <button id="btnModeDrag" onclick="setMode('drag')"
      class="px-2.5 py-1 text-xs font-medium rounded-lg transition-all bg-emerald-600 text-white shadow-sm flex items-center gap-1">
      <i class="fa-solid fa-hand"></i><span class="hidden sm:inline">Ziehen</span>
    </button>
    <button id="btnModeWaypoint" onclick="setMode('waypoint')"
      class="px-2.5 py-1 text-xs font-medium rounded-lg transition-all text-slate-300 hover:text-white flex items-center gap-1">
      <i class="fa-solid fa-location-dot"></i><span class="hidden sm:inline">Wegpunkt</span>
    </button>
  </div>

  <!-- Field view -->
  <div class="flex items-center gap-0.5 bg-slate-800 p-0.5 rounded-xl border border-slate-700">
    <button id="btnViewFull" onclick="setFieldView('full')"
      class="px-2.5 py-1 text-xs rounded-lg transition-all bg-slate-600 text-white flex items-center gap-1">
      <i class="fa-solid fa-vector-square"></i><span class="hidden md:inline">Ganzfeld</span>
    </button>
    <button id="btnViewHalf" onclick="setFieldView('half')"
      class="px-2.5 py-1 text-xs rounded-lg transition-all text-slate-400 hover:text-white flex items-center gap-1">
      <i class="fa-solid fa-arrow-up-from-bracket"></i><span class="hidden md:inline">Halbfeld</span>
    </button>
  </div>

  <div class="w-px h-6 bg-slate-700 mx-0.5 hidden sm:block"></div>

  <!-- Team colours -->
  <div class="flex items-center gap-2">
    <label class="flex items-center gap-1 text-xs cursor-pointer" title="Heim-Farbe">
      <div id="homeColorDot" class="w-4 h-4 rounded-full border border-slate-500 flex-shrink-0" style="background:#3b82f6"></div>
      <input type="color" id="colorHome" value="#3b82f6" oninput="updateTeamColor('home',this.value)" class="sr-only">
      <span class="text-slate-300 hover:text-white" onclick="document.getElementById('colorHome').click()">Heim</span>
    </label>
    <label class="flex items-center gap-1 text-xs cursor-pointer" title="Gast-Farbe">
      <div id="awayColorDot" class="w-4 h-4 rounded-full border border-slate-500 flex-shrink-0" style="background:#ef4444"></div>
      <input type="color" id="colorAway" value="#ef4444" oninput="updateTeamColor('away',this.value)" class="sr-only">
      <span class="text-slate-300 hover:text-white" onclick="document.getElementById('colorAway').click()">Gast</span>
    </label>
  </div>

  <div class="w-px h-6 bg-slate-700 mx-0.5 hidden sm:block"></div>

  <!-- Speed -->
  <div class="flex items-center gap-1.5">
    <span class="text-[10px] text-slate-400 uppercase font-bold hidden lg:inline">Tempo</span>
    <select id="speedSel" onchange="G.speed=parseFloat(this.value)"
      class="bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-lg px-2 py-1 focus:outline-none">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1.0×</option>
      <option value="2">2.0×</option>
      <option value="3">3.0×</option>
    </select>
  </div>

  <div class="flex-1"></div>

  <!-- Record -->
  <button id="btnRecord" onclick="toggleRecord()"
    class="px-2.5 py-1.5 text-xs font-semibold bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/40 rounded-xl flex items-center gap-1.5 transition-all">
    <i class="fa-solid fa-circle text-rose-400 text-[8px]"></i><span class="hidden sm:inline">Aufnahme</span>
  </button>

  <!-- Reset -->
  <button onclick="resetAll()"
    class="px-2.5 py-1.5 text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-colors border border-slate-700 flex items-center gap-1">
    <i class="fa-solid fa-rotate-left"></i><span class="hidden md:inline">Reset</span>
  </button>
</header>

<!-- ══════════════════════════════════════════════════════════ INFO BAR -->
<div id="infoBar" class="bg-slate-800/50 border-b border-slate-800 px-4 py-1 text-xs text-slate-400 flex items-center justify-between flex-shrink-0 min-h-[28px]">
  <span id="infoText">
    <i class="fa-solid fa-hand text-emerald-400 mr-1"></i><b class="text-slate-300">Zieh-Modus:</b> Spieler und Ball frei verschieben.
  </span>
  <span id="selInfo" class="text-emerald-300 font-medium"></span>
</div>

<!-- ══════════════════════════════════════════════════════════ CANVAS AREA -->
<main id="canvasWrap" class="flex-1 min-h-0 flex items-center justify-center bg-slate-950 overflow-hidden p-1 relative">
  <canvas id="pitchCanvas" class="rounded-2xl shadow-2xl mode-drag"></canvas>

  <!-- Step editing badge -->
  <div id="editBadge" class="absolute top-3 right-3 hidden bg-slate-900/95 border border-emerald-500/40 rounded-xl px-3 py-1.5 text-xs">
    <span class="text-slate-400">Schritt</span>
    <span id="editBadgeNum" class="text-emerald-400 font-black text-sm ml-1">1</span>
    <span class="text-slate-400 ml-1">wird bearbeitet</span>
  </div>
</main>

<!-- ══════════════════════════════════════════════════════════ TIMELINE -->
<footer class="bg-slate-900 border-t border-slate-800 px-3 py-2 flex items-center gap-2 flex-shrink-0 min-h-[56px]">

  <!-- Play / Stop -->
  <button id="btnPlay" onclick="togglePlay()"
    class="w-9 h-9 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center shadow-lg shadow-emerald-900/40 transition-all flex-shrink-0">
    <i id="playIcon" class="fa-solid fa-play"></i>
  </button>
  <button onclick="stopAnim()"
    class="w-7 h-7 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs transition-colors flex-shrink-0">
    <i class="fa-solid fa-stop"></i>
  </button>

  <div class="w-px h-6 bg-slate-700 flex-shrink-0"></div>

  <!-- Step chips -->
  <div id="chips" class="flex items-center gap-1.5 overflow-x-auto flex-1 py-0.5 min-w-0"></div>

  <div class="w-px h-6 bg-slate-700 flex-shrink-0"></div>

  <!-- Step management -->
  <button onclick="addStep()"
    class="px-2.5 py-1.5 text-xs font-semibold bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 rounded-xl flex items-center gap-1 transition-all flex-shrink-0">
    <i class="fa-solid fa-plus"></i> Schritt
  </button>
  <button onclick="delStep()" title="Aktuellen Schritt löschen"
    class="w-8 h-8 bg-slate-800 hover:bg-rose-900/40 text-slate-400 hover:text-rose-300 border border-slate-700 rounded-xl flex items-center justify-center text-xs transition-all flex-shrink-0">
    <i class="fa-solid fa-trash-can"></i>
  </button>
  <button onclick="clearStep()" title="Wegpunkte dieses Schritts löschen"
    class="w-8 h-8 bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 rounded-xl flex items-center justify-center text-xs transition-all flex-shrink-0">
    <i class="fa-solid fa-eraser"></i>
  </button>
</footer>

<!-- ══════════════════════════════════════════════════════════ SCRIPT -->
<script>
'use strict';

/* ═══════════════════════════════════════════════════════
   PITCH GEOMETRY (metres)
═══════════════════════════════════════════════════════ */
const PM = {
  W: 105, H: 68,           // pitch metres
  PAD: 4,                  // canvas padding around pitch
  GW: 7.32, GD: 2.44,     // goal width & depth
  PBW: 40.32, PBD: 16.5,  // penalty box
  GBW: 18.32, GBD: 5.5,   // goal box
  PS: 11, CR: 9.15,        // penalty spot dist, centre circle radius
};

/* ═══════════════════════════════════════════════════════
   DEFAULT FORMATIONS  (x/y in pitch metres)
═══════════════════════════════════════════════════════ */
const HOME_F = [
  {num:1, role:'TW', x:5,   y:34},
  {num:2, role:'RV', x:22,  y:15},
  {num:3, role:'IV', x:20,  y:26},
  {num:4, role:'IV', x:20,  y:42},
  {num:5, role:'LV', x:22,  y:53},
  {num:6, role:'DM', x:40,  y:34},
  {num:8, role:'ZM', x:49,  y:22},
  {num:10,role:'ZM', x:49,  y:46},
  {num:11,role:'LA', x:68,  y:13},
  {num:9, role:'ST', x:74,  y:34},
  {num:7, role:'RA', x:68,  y:55},
];
const AWAY_F = [
  {num:1, role:'TW', x:100, y:34},
  {num:2, role:'RV', x:83,  y:53},
  {num:3, role:'IV', x:85,  y:42},
  {num:4, role:'IV', x:85,  y:26},
  {num:5, role:'LV', x:83,  y:15},
  {num:7, role:'RM', x:66,  y:55},
  {num:8, role:'ZM', x:60,  y:44},
  {num:10,role:'ZM', x:60,  y:24},
  {num:11,role:'LM', x:66,  y:13},
  {num:9, role:'ST', x:76,  y:26},
  {num:6, role:'ST', x:76,  y:42},
];

/* ═══════════════════════════════════════════════════════
   GLOBAL STATE
═══════════════════════════════════════════════════════ */
const G = {
  players: [],
  ball: {x: PM.W/2, y: PM.H/2},

  // waypoints[stepIndex][entityId] = {x,y} in metres
  wps: {},
  numSteps: 0,
  editStep: 1,            // which step is being edited (1-based)

  sel: null,              // selected entity id for waypoint placement

  mode: 'drag',           // 'drag' | 'waypoint'
  fieldView: 'full',      // 'full' | 'half'

  homeColor: '#3b82f6',
  awayColor: '#ef4444',

  // Animation
  animating: false,
  animFrom: 0,            // step index animating FROM
  animT: 0,               // 0..1 progress within this step
  animStartTs: null,
  animRAF: null,
  speed: 1,

  // Recording
  recording: false,
  mediaRec: null,
  recChunks: [],

  // Drag
  dragging: null,         // {kind:'entity'|'waypoint', id, step?}
};

/* ═══════════════════════════════════════════════════════
   CANVAS & VIEW
═══════════════════════════════════════════════════════ */
const canvas = document.getElementById('pitchCanvas');
const ctx = canvas.getContext('2d');

// viewBox: what portion of the pitch (in metres, including padding) maps to canvas
let vb = {x: -PM.PAD, y: -PM.PAD, w: PM.W + PM.PAD*2 + PM.GD, h: PM.H + PM.PAD*2};

function setFieldView(view) {
  G.fieldView = view;
  if (view === 'full') {
    vb = {x: -PM.PAD, y: -PM.PAD, w: PM.W + PM.PAD*2 + PM.GD, h: PM.H + PM.PAD*2};
  } else {
    // right half (attacking half) + goals + padding
    vb = {x: PM.W/2 - PM.PAD, y: -PM.PAD, w: PM.W/2 + PM.PAD + PM.GD, h: PM.H + PM.PAD*2};
  }
  document.getElementById('btnViewFull').className =
    `px-2.5 py-1 text-xs rounded-lg transition-all flex items-center gap-1 ${view==='full'?'bg-slate-600 text-white':'text-slate-400 hover:text-white'}`;
  document.getElementById('btnViewHalf').className =
    `px-2.5 py-1 text-xs rounded-lg transition-all flex items-center gap-1 ${view==='half'?'bg-slate-600 text-white':'text-slate-400 hover:text-white'}`;
  resizeCanvas();
}

function resizeCanvas() {
  const wrap = document.getElementById('canvasWrap');
  const cw = wrap.clientWidth - 8;
  const ch = wrap.clientHeight - 8;
  const aspect = vb.w / vb.h;
  let w = cw, h = w / aspect;
  if (h > ch) { h = ch; w = h * aspect; }
  canvas.width  = Math.round(w);
  canvas.height = Math.round(h);
  render();
}

/* ── Coordinate helpers ── */
function m2c(mx, my) {
  return {
    x: ((mx - vb.x) / vb.w) * canvas.width,
    y: ((my - vb.y) / vb.h) * canvas.height
  };
}
function c2m(cx, cy) {
  return {
    x: (cx / canvas.width)  * vb.w + vb.x,
    y: (cy / canvas.height) * vb.h + vb.y
  };
}
function getPtr(e) {
  const r = canvas.getBoundingClientRect();
  const sx = canvas.width / r.width, sy = canvas.height / r.height;
  const src = e.touches ? e.touches[0] : e;
  return { cx: (src.clientX - r.left)*sx, cy: (src.clientY - r.top)*sy };
}

/* ── Pitch-metre scale for radius etc ── */
function mScale() { return canvas.width / vb.w; }

/* ═══════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════ */
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawPitch();
  drawWaypointLines();
  drawEntities();
}

/* ── Pitch ── */
function drawPitch() {
  const W = canvas.width, H = canvas.height;

  // Grass stripes
  const numS = 10;
  const sw = W / numS;
  for (let i = 0; i < numS; i++) {
    ctx.fillStyle = i%2===0 ? '#1a5c2a' : '#1e6630';
    ctx.fillRect(i*sw, 0, sw, H);
  }

  ctx.strokeStyle = 'rgba(241,245,249,0.95)';
  ctx.lineWidth = Math.max(1, mScale() * 0.25);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const d = (mx, my) => m2c(mx, my);
  const rect = (x1,y1,x2,y2) => {
    const a=d(x1,y1), b=d(x2,y2);
    ctx.strokeRect(a.x, a.y, b.x-a.x, b.y-a.y);
  };
  const dot = (mx, my, r) => {
    const p=d(mx,my);
    ctx.beginPath(); ctx.arc(p.x, p.y, r*mScale(), 0, Math.PI*2); ctx.fill();
  };
  const line = (x1,y1,x2,y2) => {
    const a=d(x1,y1), b=d(x2,y2);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  };

  ctx.fillStyle = 'rgba(241,245,249,0.95)';

  // Boundary
  rect(0, 0, PM.W, PM.H);

  // Centre line
  if (G.fieldView === 'full') line(PM.W/2, 0, PM.W/2, PM.H);

  // Centre circle & dot
  if (G.fieldView === 'full') {
    const cc = d(PM.W/2, PM.H/2);
    ctx.beginPath(); ctx.arc(cc.x, cc.y, PM.CR*mScale(), 0, Math.PI*2); ctx.stroke();
    dot(PM.W/2, PM.H/2, 0.3);
  }

  // Left box (only full field)
  if (G.fieldView === 'full') {
    const ly1 = (PM.H - PM.PBW)/2, ly2 = (PM.H + PM.PBW)/2;
    rect(0, ly1, PM.PBD, ly2);
    const gy1 = (PM.H - PM.GBW)/2, gy2 = (PM.H + PM.GBW)/2;
    rect(0, gy1, PM.GBD, gy2);
    dot(PM.PS, PM.H/2, 0.3);
    // Left arc (portion outside box)
    const lc=d(PM.PS, PM.H/2);
    ctx.save();
    ctx.beginPath(); ctx.rect(d(PM.PBD,0).x, 0, canvas.width, canvas.height); ctx.clip();
    ctx.beginPath(); ctx.arc(lc.x,lc.y,PM.CR*mScale(),0,Math.PI*2); ctx.stroke();
    ctx.restore();
    // Left goal
    const go1=d(-PM.GD,(PM.H-PM.GW)/2), go2=d(0,(PM.H+PM.GW)/2);
    ctx.strokeRect(go1.x, go1.y, go2.x-go1.x, go2.y-go1.y);
    // Corners
    drawCornerArc(0,0, 0,Math.PI/2);
    drawCornerArc(0,PM.H, -Math.PI/2,0);
  }

  // Right box
  const ry1=(PM.H-PM.PBW)/2, ry2=(PM.H+PM.PBW)/2;
  rect(PM.W-PM.PBD, ry1, PM.W, ry2);
  const rgy1=(PM.H-PM.GBW)/2, rgy2=(PM.H+PM.GBW)/2;
  rect(PM.W-PM.GBD, rgy1, PM.W, rgy2);
  dot(PM.W-PM.PS, PM.H/2, 0.3);
  // Right arc
  const rc=d(PM.W-PM.PS, PM.H/2);
  ctx.save();
  ctx.beginPath(); const bx=d(PM.W-PM.PBD,0); ctx.rect(0,0,bx.x,canvas.height); ctx.clip();
  ctx.beginPath(); ctx.arc(rc.x,rc.y,PM.CR*mScale(),0,Math.PI*2); ctx.stroke();
  ctx.restore();
  // Right goal
  const rgo1=d(PM.W,(PM.H-PM.GW)/2), rgo2=d(PM.W+PM.GD,(PM.H+PM.GW)/2);
  ctx.strokeRect(rgo1.x,rgo1.y,rgo2.x-rgo1.x,rgo2.y-rgo1.y);
  // Right corners
  drawCornerArc(PM.W,0, Math.PI/2,Math.PI);
  drawCornerArc(PM.W,PM.H, Math.PI,3*Math.PI/2);
}

function drawCornerArc(mx, my, a1, a2) {
  const c = m2c(mx, my);
  ctx.beginPath(); ctx.arc(c.x, c.y, mScale()*1, a1, a2); ctx.stroke();
}

/* ═══════════════════════════════════════════════════════
   ENTITY POSITIONS
═══════════════════════════════════════════════════════ */
function getInitPos(id) {
  if (id === 'ball') return {...G.ball};
  const p = G.players.find(pp => pp.id === id);
  return p ? {x:p.x, y:p.y} : {x:PM.W/2, y:PM.H/2};
}

function getPosAtStep(id, step) {
  for (let s = Math.min(step, G.numSteps); s >= 0; s--) {
    if (s === 0) return getInitPos(id);
    if (G.wps[s] && G.wps[s][id]) return {...G.wps[s][id]};
  }
  return getInitPos(id);
}

function getDisplayPos(id) {
  if (!G.animating) {
    return getPosAtStep(id, G.editStep - 1);
  }
  const from = getPosAtStep(id, G.animFrom);
  const to   = getPosAtStep(id, G.animFrom + 1);
  const t = easeInOut(G.animT);
  return {x: from.x + (to.x-from.x)*t, y: from.y + (to.y-from.y)*t};
}

function easeInOut(t) {
  return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
}

/* ═══════════════════════════════════════════════════════
   WAYPOINT LINES & CIRCLES
═══════════════════════════════════════════════════════ */
function drawWaypointLines() {
  if (G.numSteps === 0) return;

  const allIds = ['ball', ...G.players.map(p => p.id)];

  allIds.forEach(id => {
    const isBall = id === 'ball';
    const player = isBall ? null : G.players.find(p => p.id === id);
    const baseClr = isBall ? '#facc15' : (player.team==='home' ? G.homeColor : G.awayColor);

    // Collect waypoints with positions: step→pos
    const pts = [];
    pts.push({step:0, ...getInitPos(id)});
    for (let s=1; s<=G.numSteps; s++) {
      if (G.wps[s] && G.wps[s][id]) pts.push({step:s, ...G.wps[s][id]});
    }
    if (pts.length < 2) return;

    // Draw lines
    for (let i=0; i<pts.length-1; i++) {
      const a = m2c(pts[i].x,   pts[i].y);
      const b = m2c(pts[i+1].x, pts[i+1].y);
      const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
      if (len < 2) continue;

      const s = mScale();
      ctx.save();
      ctx.strokeStyle = rgba(baseClr, 0.75);
      ctx.lineWidth   = (isBall ? 2.5 : 2) * (s/10);
      ctx.lineDash    = [];
      if (isBall) ctx.setLineDash([7*(s/10), 5*(s/10)]);

      const ux=dx/len, uy=dy/len;
      const arrowEnd = {x: b.x - ux*9*(s/10), y: b.y - uy*9*(s/10)};

      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(arrowEnd.x, arrowEnd.y);
      ctx.stroke();

      // Arrow head
      ctx.setLineDash([]);
      const aSize = 11*(s/10);
      ctx.fillStyle = rgba(baseClr, 0.85);
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(arrowEnd.x - uy*aSize*0.4, arrowEnd.y + ux*aSize*0.4);
      ctx.lineTo(arrowEnd.x + uy*aSize*0.4, arrowEnd.y - ux*aSize*0.4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Draw waypoint circles (skip step 0)
    for (let i=1; i<pts.length; i++) {
      const pt = pts[i];
      const {x:cx, y:cy} = m2c(pt.x, pt.y);
      const r = wpRadius();
      const isEdit = pt.step === G.editStep && !G.animating;

      ctx.save();
      if (isEdit) { ctx.shadowColor='#10b981'; ctx.shadowBlur=10*(mScale()/10); }

      ctx.fillStyle = isBall ? '#facc15' : baseClr;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();

      ctx.strokeStyle='rgba(255,255,255,0.85)';
      ctx.lineWidth=1.5*(mScale()/10);
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();

      // Step number
      const fs = Math.max(8, r*1.15);
      ctx.fillStyle='#0f172a';
      ctx.font=`bold ${fs}px system-ui`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowBlur=0;
      ctx.fillText(String(pt.step), cx, cy);
      ctx.restore();
    }
  });
}

/* ═══════════════════════════════════════════════════════
   ENTITY DRAWING
═══════════════════════════════════════════════════════ */
function drawEntities() {
  // Ball
  const bp = getDisplayPos('ball');
  drawBall(bp.x, bp.y);

  // Players
  G.players.forEach(p => {
    const pos = getDisplayPos(p.id);
    drawPlayer(p, pos.x, pos.y);
  });
}

function drawPlayer(player, mx, my) {
  const {x:cx, y:cy} = m2c(mx, my);
  const r  = plrRadius();
  const s  = mScale()/10;
  const clr = player.team==='home' ? G.homeColor : G.awayColor;
  const isSel = G.sel === player.id;

  ctx.save();
  if (isSel) { ctx.shadowColor='#10b981'; ctx.shadowBlur=14*s; }

  ctx.fillStyle = clr;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();

  ctx.strokeStyle = isSel ? '#10b981' : 'rgba(255,255,255,0.5)';
  ctx.lineWidth   = isSel ? 2.5*s : 1.5*s;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();

  // Number
  const numFs = Math.max(7, r*1.05);
  ctx.shadowBlur=0;
  ctx.fillStyle  = contrastColor(clr);
  ctx.font       = `bold ${numFs}px system-ui`;
  ctx.textAlign  = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(player.num), cx, cy);

  // Role label
  const roleFs = Math.max(5.5, r*0.72);
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.font=`${roleFs}px system-ui`;
  ctx.fillText(player.role, cx, cy + r + roleFs*0.95);
  ctx.restore();
}

function drawBall(mx, my) {
  const {x:cx, y:cy} = m2c(mx, my);
  const r = ballRadius();
  const s = mScale()/10;
  const isSel = G.sel === 'ball';

  ctx.save();
  if (isSel) { ctx.shadowColor='#facc15'; ctx.shadowBlur=14*s; }

  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();

  // Simple pentagon pattern suggestion
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath(); ctx.arc(cx,cy,r*0.3,0,Math.PI*2); ctx.fill();

  ctx.strokeStyle = isSel ? '#facc15' : 'rgba(0,0,0,0.35)';
  ctx.lineWidth = (isSel?2.5:1.2)*s;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

function plrRadius() { return Math.max(6, mScale() * 1.38); }
function ballRadius() { return Math.max(4, mScale() * 0.72); }
function wpRadius()   { return Math.max(5, mScale() * 0.95); }

/* ═══════════════════════════════════════════════════════
   ANIMATION
═══════════════════════════════════════════════════════ */
function togglePlay() {
  G.animating ? stopAnim() : startAnim();
}

function startAnim() {
  if (G.numSteps === 0) {
    alert('Füge zuerst Schritte und Wegpunkte hinzu!'); return;
  }
  G.animating   = true;
  G.animFrom    = 0;
  G.animT       = 0;
  G.animStartTs = null;
  document.getElementById('playIcon').className = 'fa-solid fa-pause';
  if (G.recording) beginMediaRec();
  requestAnimationFrame(animFrame);
}

function animFrame(ts) {
  if (!G.animating) return;
  if (!G.animStartTs) G.animStartTs = ts;

  const dur = 1200 / G.speed;
  G.animT = Math.min(1, (ts - G.animStartTs) / dur);

  render();
  renderChips();

  if (G.animT >= 1) {
    G.animFrom++;
    G.animStartTs = null;
    G.animT = 0;
    if (G.animFrom >= G.numSteps) {
      stopAnim();
      return;
    }
  }
  G.animRAF = requestAnimationFrame(animFrame);
}

function stopAnim() {
  G.animating = false;
  G.animFrom  = 0;
  G.animT     = 0;
  if (G.animRAF) cancelAnimationFrame(G.animRAF);
  document.getElementById('playIcon').className = 'fa-solid fa-play';
  if (G.recording && G.mediaRec && G.mediaRec.state !== 'inactive') G.mediaRec.stop();
  render();
  renderChips();
}

/* ═══════════════════════════════════════════════════════
   TIMELINE
═══════════════════════════════════════════════════════ */
function renderChips() {
  const cont = document.getElementById('chips');
  cont.innerHTML = '';

  function chip(label, step, wpCount) {
    const b = document.createElement('button');
    const activeStep = G.animating ? G.animFrom : G.editStep - 1;
    const isActive = step === activeStep;
    b.className = `step-chip flex-shrink-0 px-2.5 py-1 text-xs rounded-xl border transition-all flex items-center gap-1 ${
      isActive
        ? 'bg-emerald-600 text-white border-emerald-500 shadow-sm'
        : 'bg-slate-800 text-slate-300 border-slate-700 hover:border-slate-500 hover:text-white'
    }`;
    b.textContent = label;
    if (step > 0 && wpCount > 0) {
      const sp = document.createElement('span');
      sp.className='px-1 py-0 text-[9px] rounded-full bg-white/20';
      sp.textContent=wpCount;
      b.appendChild(sp);
    }
    b.onclick = () => {
      if (!G.animating) {
        G.editStep = Math.max(1, step + 1);
        renderChips();
        updateBadge();
        render();
      }
    };
    return b;
  }

  cont.appendChild(chip('Start', 0, 0));
  for (let s=1; s<=G.numSteps; s++) {
    const wc = G.wps[s] ? Object.keys(G.wps[s]).length : 0;
    cont.appendChild(chip(`Schritt ${s}`, s, wc));
  }
}

function updateBadge() {
  const badge = document.getElementById('editBadge');
  const show  = G.mode==='waypoint' && G.numSteps>0 && !G.animating;
  badge.classList.toggle('hidden', !show);
  document.getElementById('editBadgeNum').textContent = G.editStep;
}

function addStep() {
  G.numSteps++;
  if (!G.wps[G.numSteps]) G.wps[G.numSteps]={};
  G.editStep = G.numSteps;
  renderChips(); updateBadge(); render();
}

function delStep() {
  if (G.numSteps===0) return;
  const s=G.editStep;
  delete G.wps[s];
  for (let i=s+1; i<=G.numSteps; i++) {
    G.wps[i-1]=G.wps[i]||{};
    delete G.wps[i];
  }
  G.numSteps--;
  G.editStep=Math.max(1, Math.min(G.editStep, G.numSteps));
  renderChips(); updateBadge(); render();
}

function clearStep() {
  G.wps[G.editStep]={};
  renderChips(); render();
}

/* ═══════════════════════════════════════════════════════
   HIT TEST
═══════════════════════════════════════════════════════ */
function hitTest(cx, cy) {
  const pr = plrRadius()+3, br = ballRadius()+3, wr = wpRadius()+4;

  // Waypoints first
  for (let s=1; s<=G.numSteps; s++) {
    if (!G.wps[s]) continue;
    for (const [id,pos] of Object.entries(G.wps[s])) {
      const p=m2c(pos.x,pos.y);
      if (dist(cx,cy,p.x,p.y) < wr) return {kind:'wp', id, step:s};
    }
  }

  // Ball
  const bpos = getDisplayPos('ball');
  const bp   = m2c(bpos.x, bpos.y);
  if (dist(cx,cy,bp.x,bp.y) < br) return {kind:'entity', id:'ball'};

  // Players (closest first)
  let best=null, bestD=Infinity;
  for (const pl of G.players) {
    const pos = getDisplayPos(pl.id);
    const pp  = m2c(pos.x, pos.y);
    const d   = dist(cx,cy,pp.x,pp.y);
    if (d < pr && d < bestD) { bestD=d; best={kind:'entity',id:pl.id}; }
  }
  return best;
}

function dist(x1,y1,x2,y2) { return Math.hypot(x2-x1,y2-y1); }

/* ═══════════════════════════════════════════════════════
   POINTER EVENTS
═══════════════════════════════════════════════════════ */
canvas.addEventListener('pointerdown', onDown, {passive:false});
canvas.addEventListener('pointermove', onMove, {passive:false});
canvas.addEventListener('pointerup',   onUp,   {passive:false});
canvas.addEventListener('pointerleave',onUp,   {passive:false});

function onDown(e) {
  if (G.animating) return;
  e.preventDefault();
  const {cx,cy}=getPtr(e);
  const hit=hitTest(cx,cy);

  if (G.mode==='drag') {
    if (!hit) return;
    G.dragging = hit.kind==='wp'
      ? {kind:'wp', id:hit.id, step:hit.step}
      : {kind:'entity', id:hit.id};
    canvas.classList.add('dragging');
    canvas.setPointerCapture(e.pointerId);

  } else { // waypoint mode
    if (hit && hit.kind==='entity') {
      // Select entity
      G.sel = hit.id;
      const info = document.getElementById('selInfo');
      if (hit.id==='ball') {
        info.textContent='⚽ Ball — Ziel klicken';
      } else {
        const pl=G.players.find(p=>p.id===hit.id);
        info.textContent=`#${pl.num} ${pl.role} — Ziel klicken`;
      }
      render();
    } else if (hit && hit.kind==='wp') {
      // Drag existing waypoint
      G.dragging={kind:'wp',id:hit.id,step:hit.step};
      canvas.classList.add('dragging');
      canvas.setPointerCapture(e.pointerId);
    } else if (G.sel) {
      // Place new waypoint
      if (G.numSteps===0) { alert('Füge zuerst einen Schritt hinzu!'); return; }
      const {x,y}=c2m(cx,cy);
      const mx=Math.max(0, Math.min(PM.W, x));
      const my=Math.max(0, Math.min(PM.H, y));
      if (!G.wps[G.editStep]) G.wps[G.editStep]={};
      G.wps[G.editStep][G.sel]={x:mx,y:my};
      renderChips(); render();
    }
  }
}

function onMove(e) {
  if (!G.dragging) return;
  e.preventDefault();
  const {cx,cy}=getPtr(e);
  const {x,y}=c2m(cx,cy);
  const mx=Math.max(0,Math.min(PM.W,x));
  const my=Math.max(0,Math.min(PM.H,y));

  if (G.dragging.kind==='entity') {
    if (G.dragging.id==='ball') { G.ball.x=mx; G.ball.y=my; }
    else {
      const pl=G.players.find(p=>p.id===G.dragging.id);
      if (pl) { pl.x=mx; pl.y=my; }
    }
  } else {
    if (!G.wps[G.dragging.step]) G.wps[G.dragging.step]={};
    G.wps[G.dragging.step][G.dragging.id]={x:mx,y:my};
  }
  render();
}

function onUp(e) {
  if (G.dragging) { G.dragging=null; canvas.classList.remove('dragging'); renderChips(); }
}

/* ═══════════════════════════════════════════════════════
   MODE & COLORS
═══════════════════════════════════════════════════════ */
function setMode(mode) {
  G.mode = mode;
  G.sel  = null;
  document.getElementById('selInfo').textContent='';

  const actCls='px-2.5 py-1 text-xs font-medium rounded-lg transition-all flex items-center gap-1 shadow-sm';
  const inaCls='px-2.5 py-1 text-xs font-medium rounded-lg transition-all flex items-center gap-1 text-slate-300 hover:text-white';

  document.getElementById('btnModeDrag').className =
    mode==='drag' ? actCls+' bg-emerald-600 text-white' : inaCls;
  document.getElementById('btnModeWaypoint').className =
    mode==='waypoint' ? actCls+' bg-purple-600 text-white' : inaCls;

  canvas.className = `rounded-2xl shadow-2xl mode-${mode}`;

  const info = document.getElementById('infoText');
  if (mode==='drag') {
    info.innerHTML='<i class="fa-solid fa-hand text-emerald-400 mr-1"></i><b class="text-slate-300">Zieh-Modus:</b> Spieler und Ball frei verschieben. Bestehende Wegpunkte ebenfalls verschiebbar.';
  } else {
    info.innerHTML='<i class="fa-solid fa-location-dot text-purple-400 mr-1"></i><b class="text-slate-300">Wegpunkt-Modus:</b> Spieler/Ball klicken → Ziel auf dem Feld setzen. Schritt im Zeitstrahl wählen.';
  }
  updateBadge();
  render();
}

function updateTeamColor(team, color) {
  if (team==='home') { G.homeColor=color; document.getElementById('homeColorDot').style.background=color; }
  else               { G.awayColor=color; document.getElementById('awayColorDot').style.background=color; }
  render();
}

/* ═══════════════════════════════════════════════════════
   RECORDING
═══════════════════════════════════════════════════════ */
function toggleRecord() {
  if (G.recording) {
    G.recording=false;
    const btn=document.getElementById('btnRecord');
    btn.className='px-2.5 py-1.5 text-xs font-semibold bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/40 rounded-xl flex items-center gap-1.5 transition-all';
    btn.innerHTML='<i class="fa-solid fa-circle text-rose-400 text-[8px]"></i><span class="hidden sm:inline">Aufnahme</span>';
    if (G.mediaRec && G.mediaRec.state!=='inactive') G.mediaRec.stop();
  } else {
    G.recording=true;
    const btn=document.getElementById('btnRecord');
    btn.className='px-2.5 py-1.5 text-xs font-semibold bg-rose-600 text-white border border-rose-400 rounded-xl flex items-center gap-1.5 transition-all rec-pulse';
    btn.innerHTML='<i class="fa-solid fa-circle text-white text-[8px]"></i><span class="hidden sm:inline">Aufnahme läuft…</span>';
    startAnim(); // auto-start with recording
  }
}

function beginMediaRec() {
  const stream=canvas.captureStream(30);
  G.recChunks=[];
  const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  let mime='';
  for (const t of types) if (MediaRecorder.isTypeSupported(t)) { mime=t; break; }
  G.mediaRec = new MediaRecorder(stream, mime?{mimeType:mime}:{});
  G.mediaRec.ondataavailable = e => { if (e.data.size>0) G.recChunks.push(e.data); };
  G.mediaRec.onstop = () => {
    const blob=new Blob(G.recChunks,{type:'video/webm'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`taktik_${Date.now()}.webm`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    G.recording=false;
    const btn=document.getElementById('btnRecord');
    btn.className='px-2.5 py-1.5 text-xs font-semibold bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/40 rounded-xl flex items-center gap-1.5 transition-all';
    btn.innerHTML='<i class="fa-solid fa-circle text-rose-400 text-[8px]"></i><span class="hidden sm:inline">Aufnahme</span>';
  };
  G.mediaRec.start();
}

/* ═══════════════════════════════════════════════════════
   RESET
═══════════════════════════════════════════════════════ */
function resetAll() {
  if (!confirm('Alle Spieler, Wegpunkte und Schritte zurücksetzen?')) return;
  stopAnim();
  initPlayers();
  G.wps={}; G.numSteps=0; G.editStep=1; G.sel=null;
  document.getElementById('selInfo').textContent='';
  renderChips(); updateBadge(); render();
}

/* ═══════════════════════════════════════════════════════
   INIT PLAYERS
═══════════════════════════════════════════════════════ */
function initPlayers() {
  G.players=[];
  G.ball={x:PM.W/2, y:PM.H/2};
  HOME_F.forEach((d,i) => G.players.push({id:`home-${i}`,team:'home',...d}));
  AWAY_F.forEach((d,i) => G.players.push({id:`away-${i}`,team:'away',...d}));
}

/* ═══════════════════════════════════════════════════════
   COLOR UTILS
═══════════════════════════════════════════════════════ */
function contrastColor(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)/255 > 0.55 ? '#0f172a' : '#ffffff';
}
function rgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ═══════════════════════════════════════════════════════
   KEYBOARD SHORTCUTS
═══════════════════════════════════════════════════════ */
window.addEventListener('keydown', e => {
  if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if (e.code==='Space')  { e.preventDefault(); togglePlay(); }
  if (e.code==='KeyD')   setMode('drag');
  if (e.code==='KeyW')   setMode('waypoint');
  if (e.code==='KeyA')   addStep();
  if (e.code==='Escape') { G.sel=null; document.getElementById('selInfo').textContent=''; render(); }
});

/* ═══════════════════════════════════════════════════════
   STARTUP
═══════════════════════════════════════════════════════ */
initPlayers();
setFieldView('full'); // sets vb and calls resizeCanvas
renderChips();

window.addEventListener('resize', () => { resizeCanvas(); });
window.addEventListener('DOMContentLoaded', () => { resizeCanvas(); });
</script>
